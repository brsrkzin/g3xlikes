<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta de Likes G3X</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: linear-gradient(135deg, #0033aa 0%, #0d47a1 100%);
      border: 2px solid #c41e3a;
      border-radius: 8px;
      padding: 12px 16px;
      width: auto;
      min-width: 240px;
      box-shadow: 0 4px 12px rgba(0, 51, 170, 0.4);
    }
    .header {
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-align: center;
    }
    .label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .target {
      font-size: 16px;
      color: white;
      font-weight: 700;
    }
    .target span { color: #ff6b6b; }
    .likes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
      background: white;
      border-radius: 6px;
    }
    .thumb { font-size: 20px; }
    .number {
      font-size: 18px;
      color: #0033aa;
      font-weight: 700;
    }
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #c41e3a;
      border-radius: 50%;
      margin-left: 4px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .controls {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .controls h3 {
      font-size: 12px;
      color: #0033aa;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .controls input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .controls button {
      background: #0033aa;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .controls button:hover {
      background: #0022aa;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="label">Meta de Likes</div>
      <div class="target"><span id="tgt">20K</span></div>
    </div>
    <div class="likes">
      <div class="thumb">👍</div>
      <div class="number" id="lks">0<span class="dot"></span></div>
    </div>
    
    <div class="controls" id="controls">
      <h3>🎮 Configurar</h3>
      <input type="text" id="apiKey" placeholder="API Key do YouTube" value="">
      <input type="text" id="videoId" placeholder="ID do vídeo" value="">
      <input type="number" id="target" placeholder="Meta de likes" value="20000">
      <button onclick="salvar()">Salvar & Atualizar</button>
      <p style="font-size: 11px; color: #999; margin-top: 10px;">Os dados são salvos no navegador</p>
    </div>
  </div>

  <script>
    function fmt(n) {
      if (n >= 1000000) return (n/1000000).toFixed(1).replace('.',',') + 'M';
      if (n >= 1000) return (n/1000).toFixed(1).replace('.',',') + 'K';
      return n.toString();
    }

    // Verificar se é modo display (com query params)
    const params = new URLSearchParams(window.location.search);
    const isDisplay = params.has('api') && params.has('video');

    if (isDisplay) {
      // Modo display - esconder controles
      document.getElementById('controls').classList.add('hidden');
      document.body.style.background = 'transparent';
      document.body.style.padding = '0';
      document.body.style.minHeight = 'auto';

      const apiKey = params.get('api');
      const videoId = params.get('video');
      const target = params.get('target') || '20000';

      document.getElementById('tgt').textContent = fmt(parseInt(target));

      function atualizar() {
        if (!apiKey || !videoId) {
          document.getElementById('lks').innerHTML = '⚠️<span class="dot"></span>';
          return;
        }
        
        const url = `https://www.googleapis.com/youtube/v3/videos?id=${videoId}&key=${apiKey}&part=statistics`;
        
        fetch(url)
          .then(r => r.json())
          .then(data => {
            if (data.items && data.items[0]) {
              const likes = parseInt(data.items[0].statistics.likeCount || 0);
              document.getElementById('lks').innerHTML = fmt(likes) + '<span class="dot"></span>';
            }
          })
          .catch(e => console.log('Erro:', e));
      }

      atualizar();
      setInterval(atualizar, 15000);
    } else {
      // Modo painel
      function carregar() {
        const apiKey = localStorage.getItem('apiKey') || '';
        const videoId = localStorage.getItem('videoId') || '';
        const target = localStorage.getItem('target') || '20000';
        
        document.getElementById('apiKey').value = apiKey;
        document.getElementById('videoId').value = videoId;
        document.getElementById('target').value = target;
        
        document.getElementById('tgt').textContent = fmt(parseInt(target));
        
        if (apiKey) atualizar();
      }

      function salvar() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const videoId = document.getElementById('videoId').value.trim();
        const target = document.getElementById('target').value.trim();
        
        if (!apiKey || !videoId || !target) {
          alert('Preencha todos os campos!');
          return;
        }
        
        localStorage.setItem('apiKey', apiKey);
        localStorage.setItem('videoId', videoId);
        localStorage.setItem('target', target);
        
        document.getElementById('tgt').textContent = fmt(parseInt(target));
        atualizar();
        alert('✅ Salvo com sucesso!');
      }

      function atualizar() {
        const apiKey = localStorage.getItem('apiKey');
        const videoId = localStorage.getItem('videoId');
        
        if (!apiKey || !videoId) return;
        
        const url = `https://www.googleapis.com/youtube/v3/videos?id=${videoId}&key=${apiKey}&part=statistics`;
        
        fetch(url)
          .then(r => r.json())
          .then(data => {
            if (data.items && data.items[0]) {
              const likes = parseInt(data.items[0].statistics.likeCount || 0);
              document.getElementById('lks').innerHTML = fmt(likes) + '<span class="dot"></span>';
            }
          })
          .catch(e => console.log('Erro:', e));
      }

      carregar();
      setInterval(atualizar, 15000);

      window.salvar = salvar;
    }
  </script>
</body>
</html>
